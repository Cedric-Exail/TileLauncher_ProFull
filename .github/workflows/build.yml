
name: Build
on:
 push:
  branches: [ main ]
jobs:
 build:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - name: Install Qt
     uses: jurplel/install-qt-action@v3
     with:
      version: 6.8.3
   - run: cmake -B build -S .
   - run: cmake --build build --config Release
   - run: Compress-Archive build TileLauncher.zip
   - uses: actions/upload-artifact@v4
     with:
      name: release
      path: TileLauncher.zip
