name: Build & Release (Production)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ✅ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.8.3
          arch: win64_msvc2022_64

      # ✅ Configure CMake
      - name: Configure
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      # ✅ Build
      - name: Build
        run: cmake --build build --config Release

      # ✅ Deploy Qt
      - name: Deploy Qt
        shell: powershell
        run: |
          $windeploy = Join-Path "${{ env.Qt6_DIR }}" "bin\\windeployqt.exe"

          if (!(Test-Path $windeploy)) {
              Write-Error "windeployqt not found"
              exit 1
          }

          & $windeploy build/Release/TileLauncher.exe

      # ✅ UI TEST + SCREENSHOT + PERFORMANCE
      - name: UI Test & Screenshot
        shell: powershell
        run: |
          $exe = "build/Release/TileLauncher.exe"

          if (!(Test-Path $exe)) {
              Write-Error "Executable not found"
              exit 1
          }

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process $exe -PassThru

          $shown = $false
          for ($i=0; $i -lt 50; $i++) {
              $proc.Refresh()
              if ($proc.MainWindowHandle -ne 0) {
                  $shown = $true
                  break
              }
              Start-Sleep -Milliseconds 100
          }

          $sw.Stop()
          $startupTime = $sw.ElapsedMilliseconds

          if (-not $shown) {
              Write-Error "App window not visible"
              exit 1
          }

          Write-Host "Startup Time: $startupTime ms"

          # Screenshot
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)

          $imgPath = "screenshot.png"
          $bmp.Save($imgPath, [System.Drawing.Imaging.ImageFormat]::Png)

          # Summary (ASCII safe)
          $summary = "## UI Test Result`n`n"
          $summary += "Application launched successfully`n"
          $summary += "Startup time: $startupTime ms`n`n"
          $summary += "Screenshot available in artifacts"

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          Stop-Process -Id $proc.Id -Force

      # ✅ Upload screenshot
      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UI-Test
          path: screenshot.png

      # ✅ Package (FIX PROPRE)
      - name: Package
        shell: powershell
        run: |
          Remove-Item -Recurse -Force package -ErrorAction Ignore
          New-Item -ItemType Directory -Force package/_internal | Out-Null

          Copy-Item build/Release/TileLauncher.exe package/_internal/
          Copy-Item build/Release/*.dll package/_internal/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/platforms package/_internal/platforms -Recurse -ErrorAction SilentlyContinue

          if (Test-Path _internal/tiles.ini) {
              Copy-Item _internal/tiles.ini package/_internal/
          }

          if (Test-Path TileLauncher.bat) {
              Copy-Item TileLauncher.bat package/
          }

      # ✅ ZIP (SANS imbrication)
      - name: Create ZIP
        shell: powershell
        run: |
          Remove-Item TileLauncher.zip -ErrorAction Ignore
          cd package
          Compress-Archive -Path * -DestinationPath "../TileLauncher.zip"

      # ✅ Delete previous release
      - name: Delete previous latest release
        continue-on-error: true
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          delete_release: true
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Create new release
      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: TileLauncher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Backup artifact
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileLauncher
          path: TileLauncher.zip
