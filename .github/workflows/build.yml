name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.8.3
          arch: win64_msvc2022_64

      - name: Configure
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="C:\\Qt\\6.8.3\\msvc2022_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt
        run: |
          & "C:\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" build/Release/TileLauncher.exe

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package/_internal
          Copy-Item build/Release/TileLauncher.exe package/_internal/
          Copy-Item build/Release/*.dll package/_internal/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/platforms package/_internal/platforms -Recurse -ErrorAction SilentlyContinue
          Copy-Item _internal/tiles.ini package/_internal/

      - name: Zip
        run: Compress-Archive -Path package\* -DestinationPath TileLauncher.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: TileLauncher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
