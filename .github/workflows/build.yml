name: Build & Release
on: { push: { tags: ['v*'] }}
jobs:
 build:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: jurplel/install-qt-action@v3
     with: { version: 6.8.3, arch: win64_msvc2022_64 }
   - run: cmake -B build -S .
   - run: cmake --build build --config Release
   - run: mkdir package && mkdir package/_internal && copy build\Release\TileLauncher.exe package\_internal\
   - run: Compress-Archive -Path package\* -DestinationPath TileLauncher.zip
   - uses: softprops/action-gh-release@v2
     with: { files: TileLauncher.zip }
     env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
